services:
  - type: web
    name: attendai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: "7"
      - key: MONGO_USERNAME
        sync: false
      - key: MONGO_PASSWORD
        sync: false
      - key: MONGO_HOST
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: MONGO_APP_NAME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: FACE_MATCH_THRESHOLD
        value: "0.60"
